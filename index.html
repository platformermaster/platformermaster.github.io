<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGem Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Custom Floating Text Animation */
        @keyframes floatUpFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -100%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -150%) scale(0.8);
            }
        }

        .float-text {
            position: absolute;
            pointer-events: none;
            animation: floatUpFade 0.9s ease-out forwards;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            z-index: 50;
        }

        /* Pulsing Glow Effect */
        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 25px rgba(168, 85, 247, 0.3), inset 0 0 15px rgba(168, 85, 247, 0.2);
            }
            50% {
                box-shadow: 0 0 45px rgba(236, 72, 153, 0.5), inset 0 0 25px rgba(236, 72, 153, 0.4);
            }
        }

        .gem-glow {
            animation: pulseGlow 4s infinite ease-in-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 1);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between bg-slate-950 text-slate-100 overflow-x-hidden selection:bg-purple-500 selection:text-white">

    <!-- Top Bar Navigation -->
    <header class="w-full border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-40 px-4 py-3 sm:px-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-xl shadow-lg shadow-purple-500/20">
                    <i data-lucide="gem" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg sm:text-xl bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300 bg-clip-text text-transparent">
                        CyberGem
                    </h1>
                    <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Clicker Idle</span>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button id="sound-toggle" onclick="toggleSound()" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-all duration-200 border border-slate-700/50" title="Toggle Sound">
                    <i id="sound-icon" data-lucide="volume-2" class="w-5 h-5"></i>
                </button>
                <button onclick="saveGame(true)" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-all duration-200 border border-slate-700/50" title="Manual Save">
                    <i data-lucide="save" class="w-5 h-5"></i>
                </button>
                <button onclick="confirmReset()" class="p-2.5 rounded-xl bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 hover:text-rose-100 transition-all duration-200 border border-rose-800/40" title="Reset Game Progress">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- LEFT COLUMN: Main Clicker Area & Stats -->
        <section class="lg:col-span-5 flex flex-col items-center justify-center space-y-6 bg-slate-900/40 backdrop-blur-sm border border-slate-800/80 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <!-- Background Glow Decor -->
            <div class="absolute -top-24 -left-24 w-72 h-72 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -right-24 w-72 h-72 bg-pink-600/10 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Total Score & CPS Header -->
            <div class="text-center w-full space-y-2 z-10">
                <div class="text-xs uppercase tracking-widest font-bold text-slate-400">Total Crystal Power</div>
                <div id="score-display" class="text-4xl sm:text-5xl font-black text-white tracking-tight drop-shadow-md">0</div>
                <div class="flex items-center justify-center gap-4 text-xs sm:text-sm font-semibold text-slate-400 pt-1">
                    <span class="inline-flex items-center gap-1 text-purple-400">
                        <i data-lucide="zap" class="w-4 h-4"></i> <span id="cps-display">0</span> / sec
                    </span>
                    <span class="text-slate-600">•</span>
                    <span class="inline-flex items-center gap-1 text-pink-400">
                        <i data-lucide="mouse-pointer-click" class="w-4 h-4"></i> <span id="click-power-display">1</span> / click
                    </span>
                </div>
            </div>

            <!-- Clicker Target (Main Interactive Gem) -->
            <div id="click-container" class="relative my-6 sm:my-8 flex items-center justify-center z-10">
                <canvas id="particle-canvas" class="absolute pointer-events-none w-[320px] h-[320px] sm:w-[380px] sm:h-[380px] z-0"></canvas>
                
                <button id="gem-button" class="relative group outline-none focus:outline-none transition-transform duration-100 ease-out active:scale-95 z-10" aria-label="Click Gem">
                    <div class="w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-gradient-to-br from-purple-500 via-pink-500 to-amber-400 p-1.5 gem-glow transition-all duration-300 group-hover:scale-105">
                        <div class="w-full h-full rounded-full bg-slate-950 flex items-center justify-center relative overflow-hidden">
                            <!-- Inner Gem Facets & Shimmer -->
                            <div class="absolute inset-0 bg-gradient-to-tr from-purple-900/40 via-transparent to-pink-500/20"></div>
                            <div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-white/10 to-transparent"></div>
                            <i data-lucide="gem" class="w-24 h-24 sm:w-28 sm:h-28 text-pink-400 group-hover:text-pink-300 transition-colors duration-300 drop-shadow-[0_0_20px_rgba(236,72,153,0.6)]"></i>
                        </div>
                    </div>
                </button>
            </div>

            <!-- Stats Bar & Multipliers -->
            <div class="w-full grid grid-cols-2 gap-3 pt-2 border-t border-slate-800/80 z-10">
                <div class="bg-slate-950/60 rounded-2xl p-3 border border-slate-800/60 text-center">
                    <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Prestige Bonus</div>
                    <div id="prestige-bonus-display" class="text-base font-bold text-amber-400 mt-0.5">+0%</div>
                </div>
                <div class="bg-slate-950/60 rounded-2xl p-3 border border-slate-800/60 text-center">
                    <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Lifetime Gems</div>
                    <div id="lifetime-display" class="text-base font-bold text-slate-200 mt-0.5">0</div>
                </div>
            </div>
        </section>

        <!-- RIGHT COLUMN: Upgrades & Progression Dashboard -->
        <section class="lg:col-span-7 bg-slate-900/40 backdrop-blur-sm border border-slate-800/80 rounded-3xl p-4 sm:p-6 shadow-2xl flex flex-col h-full">
            
            <!-- Tab Selection Header -->
            <div class="flex items-center space-x-2 border-b border-slate-800/80 pb-4 mb-4">
                <button id="tab-btn-generators" onclick="switchTab('generators')" class="tab-btn flex-1 py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-200 bg-purple-600/20 text-purple-300 border border-purple-500/30">
                    <i data-lucide="cpu" class="w-4 h-4"></i> Generators
                </button>
                <button id="tab-btn-upgrades" onclick="switchTab('upgrades')" class="tab-btn flex-1 py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-200 text-slate-400 hover:text-slate-200 border border-transparent">
                    <i data-lucide="zap" class="w-4 h-4"></i> Multipliers
                </button>
                <button id="tab-btn-achievements" onclick="switchTab('achievements')" class="tab-btn flex-1 py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-200 text-slate-400 hover:text-slate-200 border border-transparent">
                    <i data-lucide="award" class="w-4 h-4"></i> Badges
                </button>
                <button id="tab-btn-prestige" onclick="switchTab('prestige')" class="tab-btn flex-1 py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-200 text-slate-400 hover:text-slate-200 border border-transparent">
                    <i data-lucide="sparkles" class="w-4 h-4"></i> Prestige
                </button>
            </div>

            <!-- TAB 1: Auto Generators -->
            <div id="tab-generators" class="tab-content space-y-3 overflow-y-auto max-h-[500px] pr-1">
                <!-- Dynamically Rendered Generators Here -->
            </div>

            <!-- TAB 2: Click & Global Upgrades -->
            <div id="tab-upgrades" class="tab-content hidden space-y-3 overflow-y-auto max-h-[500px] pr-1">
                <!-- Dynamically Rendered Upgrades Here -->
            </div>

            <!-- TAB 3: Achievements -->
            <div id="tab-achievements" class="tab-content hidden space-y-3 overflow-y-auto max-h-[500px] pr-1">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="achievements-container">
                    <!-- Dynamically Rendered Achievements Here -->
                </div>
            </div>

            <!-- TAB 4: Prestige System -->
            <div id="tab-prestige" class="tab-content hidden flex flex-col items-center text-center p-6 space-y-5 bg-slate-950/40 rounded-2xl border border-slate-800/60">
                <div class="p-4 bg-gradient-to-tr from-amber-500/20 to-purple-500/20 rounded-full border border-amber-500/30">
                    <i data-lucide="sparkles" class="w-12 h-12 text-amber-400"></i>
                </div>
                <div class="space-y-2 max-w-md">
                    <h3 class="text-xl font-bold text-white">Quantum Overclock</h3>
                    <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">
                        Reset all your current gems, generators, and multipliers to acquire <span class="text-amber-400 font-semibold">Astral Shards</span>. Each Shard boosts your total income permanently by <span class="text-emerald-400 font-semibold">+10%</span>!
                    </p>
                </div>

                <div class="w-full max-w-md bg-slate-900/80 rounded-2xl p-4 border border-slate-800 space-y-2">
                    <div class="flex justify-between text-xs font-semibold">
                        <span class="text-slate-400">Current Shards:</span>
                        <span id="current-shards" class="text-amber-400">0</span>
                    </div>
                    <div class="flex justify-between text-xs font-semibold">
                        <span class="text-slate-400">Shards on Reset:</span>
                        <span id="pending-shards" class="text-emerald-400">+0</span>
                    </div>
                </div>

                <button id="prestige-btn" onclick="executePrestige()" class="w-full max-w-md py-3 px-6 rounded-xl font-extrabold text-sm transition-all duration-200 bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700" disabled>
                    Reach 100,000 Lifetime Gems to Prestige
                </button>
            </div>

        </section>

    </main>

    <!-- Achievement / Message Notification Toast -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        /* -------------------------------------------------------------------------- */
        /* GAME DATA & INITIAL STATE                                                  */
        /* -------------------------------------------------------------------------- */
        const INITIAL_STATE = {
            score: 0,
            lifetimeScore: 0,
            totalClicks: 0,
            shards: 0,
            soundEnabled: true,
            generators: {
                cursor: { count: 0, cost: 15, baseCps: 0.2 },
                drone: { count: 0, cost: 100, baseCps: 1 },
                factory: { count: 0, cost: 1100, baseCps: 8 },
                substation: { count: 0, cost: 12000, baseCps: 47 },
                quantum: { count: 0, cost: 130000, baseCps: 260 },
                matrix: { count: 0, cost: 1400000, baseCps: 1400 }
            },
            purchasedUpgrades: [],
            unlockedAchievements: []
        };

        let gameState = JSON.parse(JSON.stringify(INITIAL_STATE));

        // Generator Config Visuals
        const GENERATOR_CONFIG = {
            cursor: { name: 'Auto-Cursor', icon: 'mouse-pointer', desc: 'Clicks the gem automatically.' },
            drone: { name: 'Mining Drone', icon: 'bot', desc: 'Harvests micro-crystals from orbit.' },
            factory: { name: 'Gem Synthesizer', icon: 'factory', desc: 'Mass-produces artificial gems.' },
            substation: { name: 'Pulse Substation', icon: 'zap', desc: 'Extracts ambient crystal energy.' },
            quantum: { name: 'Quantum Core', icon: 'atom', desc: 'Bends space to extract raw gems.' },
            matrix: { name: 'Dimensional Matrix', icon: 'globe', desc: 'Taps parallel realities for infinite gems.' }
        };

        // Upgrades Configuration
        const UPGRADES_CONFIG = [
            { id: 'click_1', name: 'Reinforced Finger', cost: 100, type: 'clickMultiplier', multiplier: 2, desc: 'Doubles base click power.' },
            { id: 'click_2', name: 'Titanium Stylus', cost: 500, type: 'clickMultiplier', multiplier: 2, desc: 'Doubles base click power.' },
            { id: 'click_3', name: 'Cybernetic Touch', cost: 10000, type: 'clickMultiplier', multiplier: 3, desc: 'Triples base click power.' },
            { id: 'gen_1', name: 'Overclocked Motors', cost: 1000, type: 'globalCps', multiplier: 1.5, desc: 'Boosts all generator CPS by +50%.' },
            { id: 'gen_2', name: 'Sub-Zero Cooling', cost: 50000, type: 'globalCps', multiplier: 2, desc: 'Doubles all generator CPS.' }
        ];

        // Achievements Configuration
        const ACHIEVEMENTS_CONFIG = [
            { id: 'click_1', title: 'First Spark', desc: 'Click the CyberGem once.', icon: 'mouse-pointer-click', check: s => s.totalClicks >= 1 },
            { id: 'click_100', title: 'Fast Fingers', desc: 'Click 100 times.', icon: 'activity', check: s => s.totalClicks >= 100 },
            { id: 'score_1k', title: 'Gem Collector', desc: 'Amass 1,000 total gems.', icon: 'database', check: s => s.lifetimeScore >= 1000 },
            { id: 'score_1m', title: 'Crystal Tycoon', desc: 'Amass 1,000,000 total gems.', icon: 'crown', check: s => s.lifetimeScore >= 1000000 },
            { id: 'gen_first', title: 'Automation Era', desc: 'Purchase your first auto generator.', icon: 'cpu', check: s => Object.values(s.generators).some(g => g.count > 0) },
            { id: 'prestige_first', title: 'Cosmic Rebirth', desc: 'Perform your first Quantum Overclock.', icon: 'sparkles', check: s => s.shards > 0 }
        ];

        /* -------------------------------------------------------------------------- */
        /* AUDIO SYNTHESIZER (Web Audio API)                                          */
        /* -------------------------------------------------------------------------- */
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!gameState.soundEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    // Quick futuristic pop
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440 + Math.random() * 120, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'buy') {
                    // Ascending chime
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.06); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.12); // G5
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'achievement') {
                    // Flourish synth
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch (e) {
                console.warn('Audio synthesis issue:', e);
            }
        }

        function toggleSound() {
            gameState.soundEnabled = !gameState.soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (gameState.soundEnabled) {
                icon.setAttribute('data-lucide', 'volume-2');
                playSound('click');
            } else {
                icon.setAttribute('data-lucide', 'volume-x');
            }
            lucide.createIcons();
            saveGame(false);
        }

        /* -------------------------------------------------------------------------- */
        /* GAME CALCULATIONS                                                          */
        /* -------------------------------------------------------------------------- */
        function getPrestigeMultiplier() {
            return 1 + (gameState.shards * 0.10); // 10% bonus per shard
        }

        function getGlobalCpsMultiplier() {
            let mult = getPrestigeMultiplier();
            UPGRADES_CONFIG.forEach(upg => {
                if (upg.type === 'globalCps' && gameState.purchasedUpgrades.includes(upg.id)) {
                    mult *= upg.multiplier;
                }
            });
            return mult;
        }

        function getClickPower() {
            let base = 1;
            UPGRADES_CONFIG.forEach(upg => {
                if (upg.type === 'clickMultiplier' && gameState.purchasedUpgrades.includes(upg.id)) {
                    base *= upg.multiplier;
                }
            });
            return base * getPrestigeMultiplier();
        }

        function getTotalCPS() {
            let rawCps = 0;
            for (const [key, gen] of Object.entries(gameState.generators)) {
                rawCps += gen.count * gen.baseCps;
            }
            return rawCps * getGlobalCpsMultiplier();
        }

        /* -------------------------------------------------------------------------- */
        /* INTERACTION & FX                                                           */
        /* -------------------------------------------------------------------------- */
        const gemButton = document.getElementById('gem-button');
        const particleCanvas = document.getElementById('particle-canvas');
        const ctx = particleCanvas.getContext('2d');

        let particles = [];

        function resizeCanvas() {
            particleCanvas.width = particleCanvas.clientWidth;
            particleCanvas.height = particleCanvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 5 + 2;
                this.speedX = (Math.random() - 0.5) * 6;
                this.speedY = (Math.random() - 0.5) * 6;
                this.color = `hsl(${Math.random() * 60 + 270}, 100%, 70%)`;
                this.life = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.03;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function spawnParticles(x, y) {
            const rect = particleCanvas.getBoundingClientRect();
            const canvasX = x - rect.left;
            const canvasY = y - rect.top;

            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(canvasX, canvasY));
            }
        }

        function renderParticles() {
            ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(renderParticles);
        }
        requestAnimationFrame(renderParticles);

        function spawnFloatingText(x, y, text) {
            const floatEl = document.createElement('div');
            floatEl.className = 'float-text text-xl sm:text-2xl text-purple-300';
            floatEl.innerText = `+${formatNumber(text)}`;
            floatEl.style.left = `${x}px`;
            floatEl.style.top = `${y}px`;

            document.body.appendChild(floatEl);

            setTimeout(() => {
                floatEl.remove();
            }, 900);
        }

        // Gem Click Handler
        gemButton.addEventListener('pointerdown', (e) => {
            const clickVal = getClickPower();
            gameState.score += clickVal;
            gameState.lifetimeScore += clickVal;
            gameState.totalClicks += 1;

            playSound('click');
            spawnParticles(e.clientX, e.clientY);
            spawnFloatingText(e.clientX, e.clientY, clickVal);
            checkAchievements();
            updateUI();
        });

        /* -------------------------------------------------------------------------- */
        /* SHOP & UPGRADE LOGIC                                                       */
        /* -------------------------------------------------------------------------- */
        function buyGenerator(key) {
            const gen = gameState.generators[key];
            if (gameState.score >= gen.cost) {
                gameState.score -= gen.cost;
                gen.count += 1;
                gen.cost = Math.floor(gen.cost * 1.15); // Scale price by 15%
                playSound('buy');
                checkAchievements();
                updateUI();
                renderGenerators();
            }
        }

        function buyUpgrade(id) {
            const upg = UPGRADES_CONFIG.find(u => u.id === id);
            if (upg && !gameState.purchasedUpgrades.includes(id) && gameState.score >= upg.cost) {
                gameState.score -= upg.cost;
                gameState.purchasedUpgrades.push(id);
                playSound('buy');
                checkAchievements();
                updateUI();
                renderUpgrades();
            }
        }

        /* -------------------------------------------------------------------------- */
        /* ACHIEVEMENTS SYSTEM                                                        */
        /* -------------------------------------------------------------------------- */
        function checkAchievements() {
            ACHIEVEMENTS_CONFIG.forEach(ach => {
                if (!gameState.unlockedAchievements.includes(ach.id) && ach.check(gameState)) {
                    gameState.unlockedAchievements.push(ach.id);
                    playSound('achievement');
                    showToast(`Achievement Unlocked: ${ach.title}`);
                    renderAchievements();
                }
            });
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900 border border-purple-500/50 text-purple-200 px-4 py-3 rounded-2xl shadow-xl flex items-center space-x-3 transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-auto';
            toast.innerHTML = `
                <div class="p-1.5 bg-purple-500/20 rounded-lg text-purple-400">
                    <i data-lucide="award" class="w-5 h-5"></i>
                </div>
                <span class="text-xs font-bold">${msg}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        /* -------------------------------------------------------------------------- */
        /* PRESTIGE SYSTEM                                                            */
        /* -------------------------------------------------------------------------- */
        function calculatePendingShards() {
            if (gameState.lifetimeScore < 100000) return 0;
            return Math.floor(Math.sqrt(gameState.lifetimeScore / 100000));
        }

        function executePrestige() {
            const pending = calculatePendingShards();
            if (pending <= 0) return;

            gameState.shards += pending;
            gameState.score = 0;
            gameState.lifetimeScore = 0;
            
            // Reset Generators
            for (const key in gameState.generators) {
                gameState.generators[key].count = 0;
                gameState.generators[key].cost = INITIAL_STATE.generators[key].cost;
            }
            
            gameState.purchasedUpgrades = [];
            
            playSound('achievement');
            showToast(`Gained +${pending} Astral Shards!`);
            checkAchievements();
            
            saveGame(false);
            updateUI();
            renderGenerators();
            renderUpgrades();
            switchTab('generators');
        }

        /* -------------------------------------------------------------------------- */
        /* UI RENDERING & TAB SWITCHING                                               */
        /* -------------------------------------------------------------------------- */
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-purple-600/20', 'text-purple-300', 'border-purple-500/30');
                el.classList.add('text-slate-400', 'border-transparent');
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-btn-${tabName}`);
            activeBtn.classList.remove('text-slate-400', 'border-transparent');
            activeBtn.classList.add('bg-purple-600/20', 'text-purple-300', 'border-purple-500/30');
        }

        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'k';
            return Math.floor(num).toLocaleString();
        }

        function renderGenerators() {
            const container = document.getElementById('tab-generators');
            container.innerHTML = '';

            for (const [key, gen] of Object.entries(gameState.generators)) {
                const config = GENERATOR_CONFIG[key];
                const canAfford = gameState.score >= gen.cost;

                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border transition-all duration-200 flex items-center justify-between ${
                    canAfford 
                    ? 'bg-slate-900/60 border-slate-800 hover:border-purple-500/40' 
                    : 'bg-slate-950/40 border-slate-900/80 opacity-60'
                }`;

                card.innerHTML = `
                    <div class="flex items-center space-x-3.5">
                        <div class="p-3 bg-slate-800/80 rounded-xl text-purple-400 border border-slate-700/50">
                            <i data-lucide="${config.icon}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-sm text-slate-100">${config.name}</span>
                                <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-purple-300 font-extrabold border border-slate-700">x${gen.count}</span>
                            </div>
                            <p class="text-[11px] text-slate-400 mt-0.5">${config.desc}</p>
                            <span class="text-[11px] text-purple-400 font-semibold mt-1 inline-block">+${formatNumber(gen.baseCps * getGlobalCpsMultiplier())}/sec</span>
                        </div>
                    </div>
                    <button onclick="buyGenerator('${key}')" class="px-4 py-2.5 rounded-xl font-extrabold text-xs transition-all duration-200 ${
                        canAfford 
                        ? 'bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white shadow-lg shadow-purple-500/20 active:scale-95' 
                        : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                    }" ${!canAfford ? 'disabled' : ''}>
                        ${formatNumber(gen.cost)}
                    </button>
                `;
                container.appendChild(card);
            }
            lucide.createIcons();
        }

        function renderUpgrades() {
            const container = document.getElementById('tab-upgrades');
            container.innerHTML = '';

            UPGRADES_CONFIG.forEach(upg => {
                const purchased = gameState.purchasedUpgrades.includes(upg.id);
                const canAfford = gameState.score >= upg.cost;

                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border transition-all duration-200 flex items-center justify-between ${
                    purchased 
                    ? 'bg-emerald-950/20 border-emerald-800/40 opacity-75'
                    : canAfford 
                    ? 'bg-slate-900/60 border-slate-800 hover:border-pink-500/40' 
                    : 'bg-slate-950/40 border-slate-900/80 opacity-60'
                }`;

                card.innerHTML = `
                    <div class="flex items-center space-x-3.5">
                        <div class="p-3 bg-slate-800/80 rounded-xl text-pink-400 border border-slate-700/50">
                            <i data-lucide="${upg.type === 'clickMultiplier' ? 'mouse-pointer-click' : 'zap'}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <span class="font-bold text-sm text-slate-100">${upg.name}</span>
                            <p class="text-[11px] text-slate-400 mt-0.5">${upg.desc}</p>
                        </div>
                    </div>
                    ${
                        purchased 
                        ? `<span class="text-xs font-bold text-emerald-400 flex items-center gap-1"><i data-lucide="check" class="w-4 h-4"></i> Owned</span>`
                        : `<button onclick="buyUpgrade('${upg.id}')" class="px-4 py-2.5 rounded-xl font-extrabold text-xs transition-all duration-200 ${
                            canAfford 
                            ? 'bg-gradient-to-r from-pink-600 to-amber-600 hover:from-pink-500 hover:to-amber-500 text-white shadow-lg shadow-pink-500/20 active:scale-95' 
                            : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                        }" ${!canAfford ? 'disabled' : ''}>${formatNumber(upg.cost)}</button>`
                    }
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function renderAchievements() {
            const container = document.getElementById('achievements-container');
            container.innerHTML = '';

            ACHIEVEMENTS_CONFIG.forEach(ach => {
                const unlocked = gameState.unlockedAchievements.includes(ach.id);

                const card = document.createElement('div');
                card.className = `p-3.5 rounded-2xl border transition-all duration-200 flex items-center space-x-3 ${
                    unlocked 
                    ? 'bg-purple-950/30 border-purple-800/50 text-purple-200' 
                    : 'bg-slate-950/40 border-slate-900/80 opacity-40'
                }`;

                card.innerHTML = `
                    <div class="p-2.5 rounded-xl ${unlocked ? 'bg-purple-600/30 text-purple-300' : 'bg-slate-800 text-slate-600'}">
                        <i data-lucide="${ach.icon}" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs">${ach.title}</div>
                        <div class="text-[10px] text-slate-400 mt-0.5">${ach.desc}</div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function updateUI() {
            document.getElementById('score-display').innerText = formatNumber(gameState.score);
            document.getElementById('cps-display').innerText = formatNumber(getTotalCPS());
            document.getElementById('click-power-display').innerText = formatNumber(getClickPower());
            document.getElementById('lifetime-display').innerText = formatNumber(gameState.lifetimeScore);
            document.getElementById('prestige-bonus-display').innerText = `+${Math.round((getPrestigeMultiplier() - 1) * 100)}%`;

            // Update Prestige Tab Stats
            document.getElementById('current-shards').innerText = gameState.shards;
            const pending = calculatePendingShards();
            document.getElementById('pending-shards').innerText = `+${pending}`;
            
            const prestigeBtn = document.getElementById('prestige-btn');
            if (pending > 0) {
                prestigeBtn.disabled = false;
                prestigeBtn.className = 'w-full max-w-md py-3 px-6 rounded-xl font-extrabold text-sm transition-all duration-200 bg-gradient-to-r from-amber-500 to-purple-600 hover:from-amber-400 hover:to-purple-500 text-white shadow-lg shadow-amber-500/20 active:scale-95 cursor-pointer border-none';
                prestigeBtn.innerText = `Quantum Overclock (+${pending} Shards)`;
            } else {
                prestigeBtn.disabled = true;
                prestigeBtn.className = 'w-full max-w-md py-3 px-6 rounded-xl font-extrabold text-sm transition-all duration-200 bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700';
                prestigeBtn.innerText = 'Reach 100,000 Lifetime Gems to Prestige';
            }

            // Re-render button disabled states dynamically without wiping full DOM if visible
            document.querySelectorAll('#tab-generators button').forEach((btn, idx) => {
                const key = Object.keys(gameState.generators)[idx];
                const gen = gameState.generators[key];
                if (gen) {
                    const canAfford = gameState.score >= gen.cost;
                    btn.disabled = !canAfford;
                    btn.className = `px-4 py-2.5 rounded-xl font-extrabold text-xs transition-all duration-200 ${
                        canAfford 
                        ? 'bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white shadow-lg shadow-purple-500/20 active:scale-95' 
                        : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                    }`;
                }
            });
        }

        /* -------------------------------------------------------------------------- */
        /* PERSISTENCE & GAME LOOP                                                    */
        /* -------------------------------------------------------------------------- */
        const SAVE_KEY = 'cybergem_clicker_save_v1';

        function saveGame(manual = false) {
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));
                if (manual) showToast('Game Progress Saved!');
            } catch (e) {
                console.error('Failed to save to localStorage:', e);
            }
        }

        function loadGame() {
            try {
                const saved = localStorage.getItem(SAVE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    gameState = { ...INITIAL_STATE, ...parsed };
                    // Merge generators safely
                    for (const key in INITIAL_STATE.generators) {
                        if (!gameState.generators[key]) {
                            gameState.generators[key] = { ...INITIAL_STATE.generators[key] };
                        }
                    }
                }
            } catch (e) {
                console.error('Failed to load save state:', e);
            }
        }

        function confirmReset() {
            if (window.confirm('Are you sure you want to reset ALL progress? This cannot be undone.')) {
                localStorage.removeItem(SAVE_KEY);
                gameState = JSON.parse(JSON.stringify(INITIAL_STATE));
                updateUI();
                renderGenerators();
                renderUpgrades();
                renderAchievements();
                showToast('Game progress reset.');
            }
        }

        // Main Idle Loop (Tick every 100ms for smooth gains)
        let lastTick = Date.now();
        setInterval(() => {
            const now = Date.now();
            const delta = (now - lastTick) / 1000;
            lastTick = now;

            const cpsGain = getTotalCPS() * delta;
            if (cpsGain > 0) {
                gameState.score += cpsGain;
                gameState.lifetimeScore += cpsGain;
                checkAchievements();
                updateUI();
            }
        }, 100);

        // Auto Save every 5 seconds
        setInterval(() => {
            saveGame(false);
        }, 5000);

        /* -------------------------------------------------------------------------- */
        /* INITIALIZATION                                                             */
        /* -------------------------------------------------------------------------- */
        window.addEventListener('load', () => {
            loadGame();
            renderGenerators();
            renderUpgrades();
            renderAchievements();
            updateUI();
            lucide.createIcons();
        });
    </script>
</body>
</html>
