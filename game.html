<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Battle Royale</title>
  
  <!-- PeerJS SDK -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 1px 1px 3px #000;
      z-index: 10;
    }

    #status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      pointer-events: none;
      text-shadow: 2px 2px 5px #000;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <div id="player-lives">Lives: 3</div>
    <div id="zone-timer">Safe Zone Shrinking...</div>
    <div id="enemy-lives">Enemy Lives: 3</div>
  </div>

  <div id="status-overlay">Searching for a match...</div>

  <canvas id="gameCanvas"></canvas>

  <script>
    // 1. REPLACE WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Canvas setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusOverlay = document.getElementById('status-overlay');
    const pLivesDiv = document.getElementById('player-lives');
    const eLivesDiv = document.getElementById('enemy-lives');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game Variables
    let peer = null;
    let conn = null;
    let isHost = false;
    let roomId = null;

    const keys = {};
    let mousePos = { x: 0, y: 0 };
    let bullets = [];

    const localPlayer = { x: 100, y: window.innerHeight / 2, radius: 18, color: '#008CBA', speed: 5, lives: 3 };
    const remotePlayer = { x: window.innerWidth - 100, y: window.innerHeight / 2, radius: 18, color: '#f44336', lives: 3 };

    // Shrinking Battle Royale Zone
    const zone = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      radius: Math.max(window.innerWidth, window.innerHeight),
      shrinkRate: 0.2,
      minRadius: 80
    };

    // 2. AUTOMATIC MATCHMAKING SYSTEM
    peer = new Peer();

    peer.on('open', (myPeerId) => {
      const lobbyRef = db.ref('matchmaking_queue');

      lobbyRef.once('value', (snapshot) => {
        const rooms = snapshot.val();
        let foundRoom = false;

        if (rooms) {
          // Look for an open room created by someone else
          for (let key in rooms) {
            if (rooms[key].status === 'waiting') {
              foundRoom = true;
              roomId = key;
              const hostPeerId = rooms[key].hostPeerId;

              // Join existing room
              conn = peer.connect(hostPeerId);
              isHost = false;
              
              // Swap positions for Guest
              localPlayer.x = window.innerWidth - 100;
              localPlayer.color = '#f44336';
              remotePlayer.x = 100;
              remotePlayer.color = '#008CBA';

              db.ref(`matchmaking_queue/${roomId}`).update({ status: 'active' });
              setupConnection();
              break;
            }
          }
        }

        // If no rooms are waiting, host a new room
        if (!foundRoom) {
          isHost = true;
          const newRoomRef = lobbyRef.push();
          roomId = newRoomRef.key;

          newRoomRef.set({
            hostPeerId: myPeerId,
            status: 'waiting'
          });

          // Clean up room on disconnect
          newRoomRef.onDisconnect().remove();

          peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
            db.ref(`matchmaking_queue/${roomId}`).remove(); // Remove room once full
          });
        }
      });
    });

    function setupConnection() {
      statusOverlay.innerText = "";

      conn.on('data', (data) => {
        if (data.type === 'state') {
          remotePlayer.x = data.x;
          remotePlayer.y = data.y;
          remotePlayer.lives = data.lives;
        } else if (data.type === 'shoot') {
          bullets.push(data.bullet);
        } else if (data.type === 'hit') {
          localPlayer.lives = data.remainingLives;
        }
      });

      conn.on('close', () => {
        statusOverlay.innerText = "Opponent Left the Game";
      });
    }

    // 3. INPUT HANDLERS
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    window.addEventListener('mousemove', (e) => {
      mousePos.x = e.clientX;
      mousePos.y = e.clientY;
    });

    window.addEventListener('click', () => {
      if (!conn || localPlayer.lives <= 0 || remotePlayer.lives <= 0) return;

      const angle = Math.atan2(mousePos.y - localPlayer.y, mousePos.x - localPlayer.x);
      const bullet = {
        x: localPlayer.x,
        y: localPlayer.y,
        dx: Math.cos(angle) * 9,
        dy: Math.sin(angle) * 9,
        owner: isHost ? 'host' : 'guest'
      };

      bullets.push(bullet);
      conn.send({ type: 'shoot', bullet: bullet });
    });

    // 4. GAME LOOP LOGIC
    function update() {
      if (localPlayer.lives > 0) {
        // Player Controls
        if (keys['w'] && localPlayer.y - localPlayer.radius > 0) localPlayer.y -= localPlayer.speed;
        if (keys['s'] && localPlayer.y + localPlayer.radius < canvas.height) localPlayer.y += localPlayer.speed;
        if (keys['a'] && localPlayer.x - localPlayer.radius > 0) localPlayer.x -= localPlayer.speed;
        if (keys['d'] && localPlayer.x + localPlayer.radius < canvas.width) localPlayer.x += localPlayer.speed;

        // Shrinking Zone Damage
        if (conn && conn.open) {
          const distFromCenter = Math.hypot(localPlayer.x - zone.x, localPlayer.y - zone.y);
          if (distFromCenter > zone.radius) {
            localPlayer.lives -= 0.005; // Take passive zone damage over time
          }

          // Send updates to peer
          conn.send({
            type: 'state',
            x: localPlayer.x,
            y: localPlayer.y,
            lives: Math.ceil(localPlayer.lives)
          });
        }
      }

      // Zone Shrinking
      if (conn && conn.open && zone.radius > zone.minRadius) {
        zone.radius -= zone.shrinkRate;
      }

      // Bullets Update & Hit Detection
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.dx;
        b.y += b.dy;

        const isMyBullet = (isHost && b.owner === 'host') || (!isHost && b.owner === 'guest');
        if (isMyBullet && remotePlayer.lives > 0) {
          const dist = Math.hypot(b.x - remotePlayer.x, b.y - remotePlayer.y);
          if (dist < remotePlayer.radius) {
            bullets.splice(i, 1);
            remotePlayer.lives--;
            conn.send({ type: 'hit', remainingLives: remotePlayer.lives });
            continue;
          }
        }

        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
        }
      }

      // UI Displays
      pLivesDiv.innerText = `Your Lives: ${Math.max(0, Math.ceil(localPlayer.lives))}`;
      pLivesDiv.style.color = localPlayer.color;

      eLivesDiv.innerText = `Enemy Lives: ${Math.max(0, Math.ceil(remotePlayer.lives))}`;
      eLivesDiv.style.color = remotePlayer.color;

      if (localPlayer.lives <= 0) {
        statusOverlay.innerText = "YOU ELIMINATED!";
        statusOverlay.style.color = "#ff4444";
      } else if (remotePlayer.lives <= 0) {
        statusOverlay.innerText = "VICTORY ROYALE!";
        statusOverlay.style.color = "#44ff44";
      }
    }

    // 5. RENDERING
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Battle Royale Danger Zone
      ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';
      ctx.beginPath();
      ctx.rect(0, 0, canvas.width, canvas.height);
      ctx.arc(zone.x, zone.y, Math.max(0, zone.radius), 0, Math.PI * 2, true);
      ctx.fill();

      // Safe Zone Outline
      ctx.strokeStyle = '#55ff55';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(zone.x, zone.y, Math.max(0, zone.radius), 0, Math.PI * 2);
      ctx.stroke();

      // Local Player
      if (localPlayer.lives > 0) {
        ctx.beginPath();
        ctx.arc(localPlayer.x, localPlayer.y, localPlayer.radius, 0, Math.PI * 2);
        ctx.fillStyle = localPlayer.color;
        ctx.fill();
      }

      // Enemy Player
      if (remotePlayer.lives > 0) {
        ctx.beginPath();
        ctx.arc(remotePlayer.x, remotePlayer.y, remotePlayer.radius, 0, Math.PI * 2);
        ctx.fillStyle = remotePlayer.color;
        ctx.fill();
      }

      // Bullets
      ctx.fillStyle = '#fff';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
