<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1v1 P2P 2D Shooter</title>
  <!-- PeerJS library for serverless peer-to-peer multiplayer -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #controls {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input, button {
      padding: 8px 12px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #status {
      font-weight: bold;
      margin-bottom: 10px;
      height: 20px;
    }
    canvas {
      background-color: #111;
      border: 2px solid #444;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    #instructions {
      margin-top: 10px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div id="controls">
    <span id="my-id">Your ID: Generating...</span>
    <input type="text" id="peer-id-input" placeholder="Enter Friend's ID">
    <button id="connect-btn">Connect & Play</button>
  </div>

  <div id="status">Status: Waiting to create or join game...</div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <div id="instructions">
    Controls: <b>W, A, S, D</b> to Move | <b>Click</b> to Shoot
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const myIdSpan = document.getElementById('my-id');
    const peerIdInput = document.getElementById('peer-id-input');
    const connectBtn = document.getElementById('connect-btn');

    let peer = null;
    let conn = null;
    let isHost = false;

    // Game state
    const keys = {};
    let mousePos = { x: 0, y: 0 };
    let bullets = [];

    const localPlayer = {
      x: 100,
      y: 250,
      radius: 15,
      color: '#008CBA',
      speed: 4,
      lives: 3
    };

    const remotePlayer = {
      x: 700,
      y: 250,
      radius: 15,
      color: '#f44336',
      lives: 3
    };

    // Initialize PeerJS
    peer = new Peer();

    peer.on('open', (id) => {
      myIdSpan.innerText = `Your ID: ${id}`;
    });

    // Handle incoming connections (Player 2 connects to Player 1)
    peer.on('connection', (connection) => {
      conn = connection;
      isHost = true;
      setupConnection();
      statusDiv.innerText = "Status: Player 2 Connected! Game Started.";
    });

    // Connect button click handler
    connectBtn.addEventListener('click', () => {
      const peerId = peerIdInput.value.trim();
      if (peerId) {
        conn = peer.connect(peerId);
        isHost = false;
        // Swap starting positions if joining
        localPlayer.x = 700;
        localPlayer.color = '#f44336';
        remotePlayer.x = 100;
        remotePlayer.color = '#008CBA';
        setupConnection();
        statusDiv.innerText = "Status: Connecting to host...";
      }
    });

    function setupConnection() {
      conn.on('open', () => {
        statusDiv.innerText = "Status: Connected! Fight!";
      });

      conn.on('data', (data) => {
        if (data.type === 'state') {
          remotePlayer.x = data.x;
          remotePlayer.y = data.y;
          remotePlayer.lives = data.lives;
        } else if (data.type === 'shoot') {
          bullets.push(data.bullet);
        } else if (data.type === 'hit') {
          localPlayer.lives = data.remainingLives;
        }
      });
    }

    // Input handlers
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
      mousePos.y = e.clientY - rect.top;
    });

    canvas.addEventListener('click', () => {
      if (!conn || localPlayer.lives <= 0 || remotePlayer.lives <= 0) return;

      const angle = Math.atan2(mousePos.y - localPlayer.y, mousePos.x - localPlayer.x);
      const bullet = {
        x: localPlayer.x,
        y: localPlayer.y,
        dx: Math.cos(angle) * 7,
        dy: Math.sin(angle) * 7,
        owner: isHost ? 'host' : 'guest'
      };

      bullets.push(bullet);

      // Send bullet event to peer
      conn.send({
        type: 'shoot',
        bullet: bullet
      });
    });

    // Main Game Loop
    function update() {
      // Movement logic
      if (localPlayer.lives > 0) {
        if (keys['w'] && localPlayer.y - localPlayer.radius > 0) localPlayer.y -= localPlayer.speed;
        if (keys['s'] && localPlayer.y + localPlayer.radius < canvas.height) localPlayer.y += localPlayer.speed;
        if (keys['a'] && localPlayer.x - localPlayer.radius > 0) localPlayer.x -= localPlayer.speed;
        if (keys['d'] && localPlayer.x + localPlayer.radius < canvas.width) localPlayer.x += localPlayer.speed;

        // Send network state update
        if (conn && conn.open) {
          conn.send({
            type: 'state',
            x: localPlayer.x,
            y: localPlayer.y,
            lives: localPlayer.lives
          });
        }
      }

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.dx;
        b.y += b.dy;

        // Check collision with remote player (Host checks hits on Guest, Guest checks hits on Host)
        const myBullet = (isHost && b.owner === 'host') || (!isHost && b.owner === 'guest');
        if (myBullet) {
          const dist = Math.hypot(b.x - remotePlayer.x, b.y - remotePlayer.y);
          if (dist < remotePlayer.radius) {
            bullets.splice(i, 1);
            remotePlayer.lives--;
            conn.send({
              type: 'hit',
              remainingLives: remotePlayer.lives
            });
            continue;
          }
        }

        // Remove off-screen bullets
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw local player
      if (localPlayer.lives > 0) {
        ctx.beginPath();
        ctx.arc(localPlayer.x, localPlayer.y, localPlayer.radius, 0, Math.PI * 2);
        ctx.fillStyle = localPlayer.color;
        ctx.fill();
        ctx.closePath();
      }

      // Draw remote player
      if (remotePlayer.lives > 0) {
        ctx.beginPath();
        ctx.arc(remotePlayer.x, remotePlayer.y, remotePlayer.radius, 0, Math.PI * 2);
        ctx.fillStyle = remotePlayer.color;
        ctx.fill();
        ctx.closePath();
      }

      // Draw bullets
      ctx.fillStyle = '#fff';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.closePath();
      });

      // Draw UI (Lives)
      ctx.font = '16px Arial';
      ctx.fillStyle = localPlayer.color;
      ctx.fillText(`Your Lives: ${Math.max(0, localPlayer.lives)}`, 20, 30);

      ctx.fillStyle = remotePlayer.color;
      ctx.fillText(`Enemy Lives: ${Math.max(0, remotePlayer.lives)}`, canvas.width - 140, 30);

      // Win/Loss message
      if (localPlayer.lives <= 0) {
        ctx.fillStyle = '#ff4444';
        ctx.font = '40px Arial';
        ctx.fillText('YOU LOST!', canvas.width / 2 - 100, canvas.height / 2);
      } else if (remotePlayer.lives <= 0) {
        ctx.fillStyle = '#44ff44';
        ctx.font = '40px Arial';
        ctx.fillText('YOU WIN!', canvas.width / 2 - 90, canvas.height / 2);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
