<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My HTML Game</title>
</head>
<body>
    <h1>My Awesome Game</h1>
    <button id="scoreBtn">Score! (+10 pts)</button>
    <p>Current Score: <span id="scoreVal">0</span></p>

    <!-- Load the Firebase SDK as ES modules -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
