<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Firebase Battle Royale</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 3px solid #444;
      background: #1a1a1a;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    canvas { display: block; background: #222; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      pointer-events: none;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }
    #kill-feed {
      position: absolute;
      top: 10px;
      right: 10px;
      text-align: right;
      font-size: 14px;
      color: #ff4444;
      pointer-events: none;
    }
    #login-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    input {
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: none;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #218838; }
  </style>

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div id="game-container">
    <div id="ui">
      <div>HP: <span id="hp-display">100</span></div>
      <div>Alive Players: <span id="alive-display">0</span></div>
      <div style="color: #4da6ff;">Zone Safe Radius: <span id="zone-display">800</span></div>
    </div>
    <div id="kill-feed"></div>
    
    <div id="login-overlay">
      <h1 style="margin-bottom: 20px;">2D BATTLE ROYALE</h1>
      <input type="text" id="username" placeholder="Enter Nickname" maxlength="12">
      <button onclick="joinGame()">PLAY</button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>

  <script>
    // 1. Initialize Firebase with your Database URL
    const firebaseConfig = {
      databaseURL: "https://html-game-1-236a9-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Game Constants
    const MAP_SIZE = 1600; // World is 1600x1600, Canvas viewport is 800x600
    const VIEW_W = 800;
    const VIEW_H = 600;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let playerId = null;
    let playerRef = null;
    let playersData = {};
    let bulletsData = {};
    let myData = null;

    // Keys state
    const keys = { w: false, a: false, s: false, d: false };
    let mousePos = { x: 0, y: 0 };

    // Shrinking Storm Zone Data
    let zone = { x: MAP_SIZE / 2, y: MAP_SIZE / 2, radius: MAP_SIZE };

    function joinGame() {
      const nameInput = document.getElementById('username').value.trim();
      const name = nameInput || 'Player_' + Math.floor(Math.random() * 1000);

      // Create unique player entry in Firebase
      const playersRef = db.ref('players');
      playerRef = playersRef.push();
      playerId = playerRef.key;

      myData = {
        id: playerId,
        name: name,
        x: Math.random() * (MAP_SIZE - 200) + 100,
        y: Math.random() * (MAP_SIZE - 200) + 100,
        hp: 100,
        angle: 0,
        color: `hsl(${Math.random() * 360}, 70%, 50%)`,
        isAlive: true
      };

      // Handle disconnect cleanly
      playerRef.onDisconnect().remove();
      playerRef.set(myData);

      document.getElementById('login-overlay').style.display = 'none';

      // Setup Listeners
      setupListeners();
      
      // Start Game Loops
      requestAnimationFrame(gameLoop);
      setInterval(updateNetwork, 1000 / 30); // Sync network at 30 FPS
      setInterval(shrinkZone, 2000); // Storm shrinks gradually
    }

    function setupListeners() {
      // Sync all players from Firebase
      db.ref('players').on('value', (snapshot) => {
        playersData = snapshot.val() || {};
        if (playersData[playerId]) {
          myData.hp = playersData[playerId].hp;
          myData.isAlive = playersData[playerId].isAlive;
        }
      });

      // Sync Bullets
      db.ref('bullets').on('value', (snapshot) => {
        bulletsData = snapshot.val() || {};
      });

      // Keyboard Controls
      window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
      });
      window.addEventListener('keyup', (e) => {
        if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
      });

      // Mouse Aiming & Shooting
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mousePos.x = e.clientX - rect.left;
        mousePos.y = e.clientY - rect.top;
      });

      canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0 && myData && myData.isAlive) {
          shootBullet();
        }
      });
    }

    function shootBullet() {
      const screenCenterX = VIEW_W / 2;
      const screenCenterY = VIEW_H / 2;
      const angle = Math.atan2(mousePos.y - screenCenterY, mousePos.x - screenCenterX);

      const bulletRef = db.ref('bullets').push();
      bulletRef.set({
        id: bulletRef.key,
        owner: playerId,
        x: myData.x,
        y: myData.y,
        vx: Math.cos(angle) * 12,
        vy: Math.sin(angle) * 12,
        createdAt: Date.now()
      });
    }

    function shrinkZone() {
      if (zone.radius > 100) {
        zone.radius -= 5;
      }
    }

    function updatePhysics() {
      if (!myData || !myData.isAlive) return;

      const speed = 4;
      let dx = 0, dy = 0;

      if (keys.w) dy -= speed;
      if (keys.s) dy += speed;
      if (keys.a) dx -= speed;
      if (keys.d) dx += speed;

      // Normalize diagonal speed
      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
      }

      myData.x = Math.max(20, Math.min(MAP_SIZE - 20, myData.x + dx));
      myData.y = Math.max(20, Math.min(MAP_SIZE - 20, myData.y + dy));

      // Calculate aiming angle
      const screenCenterX = VIEW_W / 2;
      const screenCenterY = VIEW_H / 2;
      myData.angle = Math.atan2(mousePos.y - screenCenterY, mousePos.x - screenCenterX);

      // Storm Damage
      const distToZoneCenter = Math.hypot(myData.x - zone.x, myData.y - zone.y);
      if (distToZoneCenter > zone.radius) {
        myData.hp -= 0.2; // Take damage if outside safe zone
        if (myData.hp <= 0 && myData.isAlive) {
          myData.isAlive = false;
          playerRef.update({ isAlive: false, hp: 0 });
        }
      }

      // Check Bullet Collisions against local player
      for (let bId in bulletsData) {
        let b = bulletsData[bId];
        if (b.owner !== playerId) {
          let dist = Math.hypot(myData.x - b.x, myData.y - b.y);
          if (dist < 20) { // Hitbox radius
            myData.hp -= 20;
            db.ref('bullets/' + bId).remove(); // Remove hit bullet
            if (myData.hp <= 0 && myData.isAlive) {
              myData.isAlive = false;
            }
            playerRef.update({ hp: Math.max(0, myData.hp), isAlive: myData.isAlive });
          }
        }
      }
    }

    function updateNetwork() {
      if (playerRef && myData && myData.isAlive) {
        playerRef.update({
          x: myData.x,
          y: myData.y,
          angle: myData.angle,
          hp: myData.hp
        });
      }

      // Cleanup old bullets (host side processing simulated)
      const now = Date.now();
      for (let bId in bulletsData) {
        let b = bulletsData[bId];
        // Move bullet prediction
        b.x += b.vx;
        b.y += b.vy;
        if (now - b.createdAt > 3000) { // Bullets expire after 3s
          if (b.owner === playerId) {
            db.ref('bullets/' + bId).remove();
          }
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, VIEW_W, VIEW_H);

      // Camera offset relative to my player position
      const camX = myData ? myData.x - VIEW_W / 2 : MAP_SIZE / 2 - VIEW_W / 2;
      const camY = myData ? myData.y - VIEW_H / 2 : MAP_SIZE / 2 - VIEW_H / 2;

      ctx.save();
      ctx.translate(-camX, -camY);

      // 1. Draw Map Boundaries
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

      // Grid background
      ctx.strokeStyle = '#282828';
      ctx.lineWidth = 1;
      for (let x = 0; x < MAP_SIZE; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
      }
      for (let y = 0; y < MAP_SIZE; y += 80) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
      }

      // 2. Draw Storm Safe Zone
      ctx.beginPath();
      ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(77, 166, 255, 0.8)';
      ctx.lineWidth = 4;
      ctx.stroke();

      // 3. Draw Bullets
      ctx.fillStyle = '#ffcc00';
      for (let bId in bulletsData) {
        let b = bulletsData[bId];
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // 4. Draw Players
      let aliveCount = 0;
      for (let pId in playersData) {
        let p = playersData[pId];
        if (!p.isAlive) continue;
        aliveCount++;

        ctx.save();
        ctx.translate(p.x, p.y);

        // Name tag & Health bar
        ctx.fillStyle = '#fff';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, 0, -30);

        // Health bar
        ctx.fillStyle = '#555';
        ctx.fillRect(-20, -25, 40, 5);
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(-20, -25, (p.hp / 100) * 40, 5);

        // Player Circle Body
        ctx.rotate(p.angle);
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000';
        ctx.stroke();

        // Gun barrel
        ctx.fillStyle = '#888';
        ctx.fillRect(10, 3, 14, 5);

        ctx.restore();
      }

      ctx.restore();

      // Update UI Counters
      if (myData) {
        document.getElementById('hp-display').innerText = Math.max(0, Math.ceil(myData.hp));
        document.getElementById('alive-display').innerText = aliveCount;
        document.getElementById('zone-display').innerText = Math.ceil(zone.radius);
      }
    }

    function gameLoop() {
      updatePhysics();
      render();
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
